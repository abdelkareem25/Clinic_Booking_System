<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <title>Clinic — Care Operations</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Clinic management system — patients, appointments, medical records and accounts.">
  <meta name="theme-color" content="#0f766e" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b0f14" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!--
    Inter carries the Latin UI; IBM Plex Sans Arabic carries Arabic. Both are
    loaded up front because the language can flip at runtime without a reload,
    and a font swap mid-session is far more jarring than the extra request.
  -->
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >
  <!--
    Applied before first paint so a dark-mode user never sees a white flash.
    Mirrors ThemeService's storage key and fallback so the two cannot disagree.
  -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('clinic.theme');
        var dark = stored === 'dark' ||
          (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');

        var lang = localStorage.getItem('clinic.lang');
        if (lang === 'ar') {
          document.documentElement.lang = 'ar';
          document.documentElement.dir = 'rtl';
        }
      } catch (e) { /* storage blocked — fall back to the light LTR default */ }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
