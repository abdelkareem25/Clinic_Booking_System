<h2 mat-dialog-title>{{ (isEdit ? 'doctors.edit' : 'doctors.new') | translate }}</h2>

<mat-dialog-content>
  <form class="doctor-form" [formGroup]="form" novalidate>
    <div class="field">
      <mat-form-field>
        <mat-label>{{ 'doctors.name' | translate }}</mat-label>
        <input matInput type="text" formControlName="name" autocomplete="name" />
      </mat-form-field>
      <ui-field-error [control]="form.controls.name" [submitted]="submitted()" />
    </div>

    <div class="field">
      <!-- Autocomplete rather than a select: specialities in use are suggested,
           but a clinic must still be able to enter one we did not predict. -->
      <mat-form-field>
        <mat-label>{{ 'doctors.specialization' | translate }}</mat-label>
        <input matInput type="text" formControlName="specialization" [matAutocomplete]="specAuto" />
        <mat-autocomplete #specAuto>
          @for (specialization of specializations; track specialization) {
            <mat-option [value]="specialization">{{ specialization }}</mat-option>
          }
        </mat-autocomplete>
      </mat-form-field>
      <ui-field-error [control]="form.controls.specialization" [submitted]="submitted()" />
    </div>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="dialogRef.close(false)">
    {{ 'common.cancel' | translate }}
  </button>
  <button mat-flat-button type="button" [disabled]="saving()" (click)="submit()">
    {{ (saving() ? 'common.saving' : 'common.save') | translate }}
  </button>
</mat-dialog-actions>
