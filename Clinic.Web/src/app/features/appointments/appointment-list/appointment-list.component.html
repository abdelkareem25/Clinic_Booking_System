<app-page-header
  title="Appointments"
  subtitle="Schedule, review, and manage clinic appointments."
  icon="event_available"
  actionLabel="Book appointment"
  actionIcon="add"
  (action)="openCreate()"
/>

<form class="filter-bar" [formGroup]="filterForm">
  <mat-form-field>
    <mat-label>Doctor</mat-label>
    <mat-select formControlName="doctorId">
      <mat-option [value]="null">All doctors</mat-option>
      @for (option of doctorOptions(); track option.value) {
        <mat-option [value]="option.value">{{ option.label }}</mat-option>
      }
    </mat-select>
  </mat-form-field>

  <mat-form-field>
    <mat-label>Patient</mat-label>
    <mat-select formControlName="patientId">
      <mat-option [value]="null">All patients</mat-option>
      @for (option of patientOptions(); track option.value) {
        <mat-option [value]="option.value">{{ option.label }}</mat-option>
      }
    </mat-select>
  </mat-form-field>

  <mat-form-field>
    <mat-label>Status</mat-label>
    <mat-select formControlName="status">
      <mat-option [value]="null">All statuses</mat-option>
      @for (status of statuses; track status) {
        <mat-option [value]="status">{{ status }}</mat-option>
      }
    </mat-select>
  </mat-form-field>

  <button mat-stroked-button type="button" (click)="resetFilters()">
    <mat-icon>restart_alt</mat-icon>
    Reset
  </button>
</form>

<app-data-table
  [columns]="columns"
  [actions]="actions"
  [rows]="appointments()"
  [loading]="loading()"
  emptyIcon="event_busy"
  emptyTitle="No appointments found"
  emptyMessage="Book an appointment or adjust the filters."
  (rowAction)="onRowAction($event)"
  (sortChange)="onSortChanged($event)"
/>

@if (total() > 0) {
  <mat-paginator
    [length]="total()"
    [pageIndex]="pageIndex"
    [pageSize]="pageSize"
    [pageSizeOptions]="[5, 10, 20]"
    showFirstLastButtons
    (page)="onPage($event)"
  />
}
