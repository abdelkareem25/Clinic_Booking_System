<header class="page-header">
  <div class="title-group">
    @if (icon) {
      <span class="icon-wrap"><mat-icon>{{ icon }}</mat-icon></span>
    }
    <div>
      <h1>{{ title }}</h1>
      @if (subtitle) {
        <p>{{ subtitle }}</p>
      }
    </div>
  </div>

  @if (actionLabel) {
    <button mat-flat-button color="primary" type="button" (click)="action.emit()">
      <mat-icon>{{ actionIcon }}</mat-icon>
      {{ actionLabel }}
    </button>
  }
</header>
